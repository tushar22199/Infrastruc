name: CI

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # The API imports the shared database client during tests.
      # Authorization-focused tests do not require a live database.
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/infrasight_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript typecheck
        run: pnpm run typecheck

      - name: Run unit tests
        run: pnpm --filter @workspace/api-server test

      - name: Build project
        run: pnpm run build

      - name: Build Docker image
        run: docker build -t infrastructure-auditor .
